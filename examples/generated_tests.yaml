metadata:
  generator: AgentEval
  version: '1.0'
  total_tests: 5
test_cases:
- id: test_RefundProcessor.process_refund_request_raises_ValueError
  name: RefundProcessor.process_refund_request_raises_ValueError
  category: policy_enforcement
  expected_outcome: Policy correctly enforced
  pass_threshold: 0.8
  conversation:
    name: policy_violation_general_policy
    description: Customer requests something that violates general_policy
    scenario_type: error_path
    context:
      policy: general_policy
      violation: request violates policy
      customer_request: Can you help me with Function should raise ValueError under
        certain conditions?
    turns:
    - customer_message: Can you help me with Function should raise ValueError under
        certain conditions?
      checkpoints:
      - criterion: policy_enforcement
        check_type: must
        description: Does not grant request that violates general_policy
        weight: 0.5
      - criterion: explanation
        check_type: must
        description: Explains the policy reason clearly
        weight: 0.3
      - criterion: alternative_offered
        check_type: should
        description: Offers alternative solution if possible
        weight: 0.2
      agent_actions: []
    evaluation_dimensions:
      policy_compliance: 0.5
      empathy: 0.2
      helpfulness: 0.3
- id: test_RefundProcessor.__init___happy_path
  name: RefundProcessor.__init___happy_path
  category: refunds
  expected_outcome: Successful resolution
  pass_threshold: 0.7
  conversation:
    name: refund_request_standard
    description: Customer requesting refund for product within policy window
    scenario_type: happy_path
    context:
      customer_tier: standard
      order:
        item: product
        price: 99.99
        delivered_date_days_ago: 5
    turns:
    - customer_message: I want to return my product. It doesn't work as expected.
      checkpoints:
      - criterion: empathy
        check_type: must
        description: Acknowledges customer's issue
        weight: 0.2
      - criterion: information_gathering
        check_type: must
        description: Asks about order details or offers to look it up
        weight: 0.3
      - criterion: no_immediate_refusal
        check_type: must_not
        description: Does not refuse without understanding the issue
        weight: 0.5
      agent_actions: []
    - customer_message: My order number is ORD-12345. I got it last week.
      checkpoints:
      - criterion: policy_check
        check_type: must
        description: Verifies refund eligibility (within window)
        weight: 0.4
      - criterion: offers_solution
        check_type: must
        description: Offers refund or replacement options
        weight: 0.4
      - criterion: clear_next_steps
        check_type: must
        description: Explains what will happen next
        weight: 0.2
      agent_actions:
      - verify_order
      - check_refund_eligibility
    - customer_message: Okay, I'll take the refund. How long will it take?
      checkpoints:
      - criterion: timeline_provided
        check_type: must
        description: Gives specific timeline for refund processing
        weight: 0.3
      - criterion: confirmation
        check_type: must
        description: Confirms refund has been initiated
        weight: 0.5
      - criterion: professional_close
        check_type: should
        description: Ends conversation professionally
        weight: 0.2
      agent_actions:
      - initiate_refund
    evaluation_dimensions:
      empathy: 0.2
      resolution: 0.35
      policy_compliance: 0.25
      efficiency: 0.2

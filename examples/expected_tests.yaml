# Golden test set for TechGear customer service agent
# These are hand-crafted tests with known correct answers

test_suite:
  name: "TechGear Customer Service - Golden Tests"
  knowledge_base: "./knowledge-base"

tests:
  # ===== Q&A Tests (Factual) =====

  - id: qa_001
    type: qa
    category: returns
    input:
      message: "What is your return policy?"
    expected:
      contains_facts:
        - "30-day"
        - "original packaging"
        - "5-7 business days"
      sources: ["policies/returns.md"]

  - id: qa_002
    type: qa
    category: shipping
    input:
      message: "How much does shipping cost?"
    expected:
      contains_facts:
        - "free on orders over $50"
        - "$5.99"
        - "Express shipping"
        - "$12.99"
      sources: ["policies/shipping.md"]

  - id: qa_003
    type: qa
    category: shipping
    input:
      message: "Do you ship internationally?"
    expected:
      contains_facts:
        - "Canada"
        - "UK"
        - "Europe"
      sources: ["policies/shipping.md"]

  - id: qa_004
    type: qa
    category: warranty
    input:
      message: "What warranty do you offer?"
    expected:
      contains_facts:
        - "1 year"
        - "manufacturer"
      sources: ["policies/warranty.md"]

  - id: qa_005
    type: qa
    category: contact
    input:
      message: "How can I contact customer support?"
    expected:
      contains_facts:
        - "1-800"
        - "support@techgear"
      sources: ["company-info.md", "faq.md"]

  - id: qa_006
    type: qa
    category: payment
    input:
      message: "What payment methods do you accept?"
    expected:
      contains_facts:
        - "Visa"
        - "MasterCard"
        - "PayPal"
        - "Apple Pay"
      sources: ["company-info.md"]

  - id: qa_007
    type: qa
    category: hours
    input:
      message: "What are your business hours?"
    expected:
      contains_facts:
        - "Monday"
        - "Friday"
        - "9 AM"
        - "6 PM"
      sources: ["company-info.md"]

  - id: qa_008
    type: qa
    category: shipping
    input:
      message: "How long does standard shipping take?"
    expected:
      contains_facts:
        - "5-7 business days"
      sources: ["policies/shipping.md"]

  - id: qa_009
    type: qa
    category: returns
    input:
      message: "Can I return opened headphones?"
    expected:
      contains_facts:
        - "15 days"
        - "hygiene"
      sources: ["policies/returns.md"]

  - id: qa_010
    type: qa
    category: warranty
    input:
      message: "Do you have extended warranty options?"
    expected:
      contains_facts:
        - "Protection Plan"
        - "$49.99"
        - "$99.99"
      sources: ["policies/warranty.md"]

  - id: qa_011
    type: qa
    category: returns
    input:
      message: "How do I return an item?"
    expected:
      contains_facts:
        - "Order History"
        - "Return Item"
        - "prepaid return label"
        - "UPS"
      sources: ["policies/returns.md"]

  - id: qa_012
    type: qa
    category: shipping
    input:
      message: "Is same-day delivery available?"
    expected:
      contains_facts:
        - "Same-Day"
        - "$14.99"
        - "12 PM"
      sources: ["policies/shipping.md"]

  - id: qa_013
    type: qa
    category: products
    input:
      message: "What categories of products do you sell?"
    expected:
      contains_facts:
        - "Laptops"
        - "Smartphones"
        - "Audio"
        - "Smart Home"
      sources: ["products.md"]

  - id: qa_014
    type: qa
    category: payment
    input:
      message: "Can I pay in installments?"
    expected:
      contains_facts:
        - "Affirm"
        - "financing"
        - "$200"
      sources: ["company-info.md", "faq.md"]

  - id: qa_015
    type: qa
    category: returns
    input:
      message: "What items cannot be returned?"
    expected:
      contains_facts:
        - "software"
        - "digital downloads"
        - "Gift cards"
        - "Final Sale"
      sources: ["policies/returns.md"]

  - id: qa_016
    type: qa
    category: warranty
    input:
      message: "What does the warranty NOT cover?"
    expected:
      contains_facts:
        - "Physical damage"
        - "Water damage"
        - "unauthorized repairs"
      sources: ["policies/warranty.md"]

  - id: qa_017
    type: qa
    category: company
    input:
      message: "Where are your stores located?"
    expected:
      contains_facts:
        - "New York"
        - "Los Angeles"
        - "Chicago"
        - "Austin"
      sources: ["company-info.md"]

  - id: qa_018
    type: qa
    category: returns
    input:
      message: "Do you have a holiday return policy?"
    expected:
      contains_facts:
        - "November 15"
        - "December 31"
        - "January 31"
      sources: ["policies/returns.md"]

  - id: qa_019
    type: qa
    category: products
    input:
      message: "Do you offer price matching?"
    expected:
      contains_facts:
        - "price match"
        - "14 days"
        - "5% off"
      sources: ["products.md"]

  - id: qa_020
    type: qa
    category: shipping
    input:
      message: "What if my package is damaged during shipping?"
    expected:
      contains_facts:
        - "48 hours"
        - "photos"
        - "replacement"
      sources: ["policies/shipping.md"]

  # ===== Edge Case Tests =====

  - id: edge_001
    type: edge_case
    category: out_of_scope
    input:
      message: "Can you help me file my taxes?"
    expected:
      should_decline: true
      tone: polite

  - id: edge_002
    type: edge_case
    category: out_of_scope
    input:
      message: "What's the weather like in New York?"
    expected:
      should_decline: true
      tone: polite

  - id: edge_003
    type: edge_case
    category: non_existent
    input:
      message: "Do you sell flying cars?"
    expected:
      should_decline: true
      tone: helpful

  - id: edge_004
    type: edge_case
    category: ambiguous
    input:
      message: "Tell me about your policies"
    expected:
      should_decline: false
      tone: helpful

  - id: edge_005
    type: edge_case
    category: non_existent
    input:
      message: "What is your refund policy for items purchased 5 years ago?"
    expected:
      should_decline: false
      tone: helpful

  # ===== Consistency Tests =====

  - id: cons_001
    type: consistency
    category: returns_rephrase
    input:
      message: "How do returns work?"
    expected:
      consistency_with: qa_001
      contains_facts:
        - "30-day"
        - "original packaging"

  - id: cons_002
    type: consistency
    category: shipping_rephrase
    input:
      message: "What are your shipping options?"
    expected:
      consistency_with: qa_002
      contains_facts:
        - "free"
        - "$50"

  - id: cons_003
    type: consistency
    category: warranty_rephrase
    input:
      message: "Tell me about product warranties"
    expected:
      consistency_with: qa_004
      contains_facts:
        - "1 year"

  - id: cons_004
    type: consistency
    category: contact_rephrase
    input:
      message: "I need to speak to someone"
    expected:
      consistency_with: qa_005
      contains_facts:
        - "1-800"

  - id: cons_005
    type: consistency
    category: returns_rephrase
    input:
      message: "Can I return items?"
    expected:
      consistency_with: qa_001
      contains_facts:
        - "30-day"

